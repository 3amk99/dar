<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="flex justify-center items-center ">
    <form id="Form" class=" bg-gray-100 grid grid-cols-2 gap-4 p-2">
        <label for="nom">Name:</label>
        <input type="text" id="nom" name="nom" class="border border-blue-500 w-full rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required>

        <label for="couleur">Color:</label>
        <input type="text" id="couleur" name="couleur" class="border border-blue-500 w-full rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required>

        <label for="icone">Icon:</label>
        <input type="text" id="icone" name="icone" class="border border-blue-500 w-full rounded-md p-2 focus:outline-none focus:ring-2 focus:ring-blue-500" required>

        <button type="submit" class="border border-blue p-2 w-full rounded-md bg-green-100">Add Category</button>
    </form>
    
</div>
<div class="flex justify-center items-center">
<table border="5" class="w-[80%] mt-4">
        <thead>
            <tr>
                <th class="border-2 border-black ">ID</th>
                <th class="border-2 border-black ">Name</th>
                <th class="border-2 border-black ">Color</th>
                <th class="border-2 border-black ">Icon</th>
            </tr>
        </thead>
        <tbody id="tableBody" class="bg-gray-200">
            <!-- Category rows will be added here dynamically -->
        </tbody>
    </table>
    </div>
</body>
</html>
